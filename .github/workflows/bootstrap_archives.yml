name: Generate custom bootstrap archives

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch:
          - aarch64
    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 tar zip wget curl jq dpkg-dev

      - name: Create bootstrap archive
        run: |
          # Add x11-repo (which is in termux-main repository)
          ./scripts/generate-bootstraps.sh --architectures ${{ matrix.arch }} --add x11-repo

      - name: Inject Termux-X11 & Auto-Start Script into Bootstrap
        run: |
          mkdir -p temp_bootstrap
          unzip bootstrap-${{ matrix.arch }}.zip -d temp_bootstrap

          # Download latest termux-x11 package directly from official GitHub releases
          echo "[*] Downloading termux-x11 companion package..."
          wget -q https://github.com/termux/termux-x11/releases/download/nightly/termux-x11-nightly-all.deb -O termux-x11.deb || true
          
          if [ -f termux-x11.deb ]; then
            echo "[*] Unpacking termux-x11 into bootstrap..."
            dpkg-deb -x termux-x11.deb temp_bootstrap/
          fi

          # Inject X11 Auto-Trigger logic into bash.bashrc
          echo '# Auto-start X11 Display Server on Boot' >> temp_bootstrap/usr/etc/bash.bashrc
          echo 'if [ -z "$DISPLAY" ] && [ -n "$TERMUX_VERSION" ]; then' >> temp_bootstrap/usr/etc/bash.bashrc
          echo '    export DISPLAY=:0' >> temp_bootstrap/usr/etc/bash.bashrc
          echo '    if ! pgrep -x "termux-x11" > /dev/null; then' >> temp_bootstrap/usr/etc/bash.bashrc
          echo '        termux-x11 :0 -ac &' >> temp_bootstrap/usr/etc/bash.bashrc
          echo '    fi' >> temp_bootstrap/usr/etc/bash.bashrc
          echo '    am start -n com.termux.x11/com.termux.x11.MainActivity > /dev/null 2>&1 || true' >> temp_bootstrap/usr/etc/bash.bashrc
          echo 'fi' >> temp_bootstrap/usr/etc/bash.bashrc

          # Re-pack the bootstrap zip
          cd temp_bootstrap
          zip -r ../bootstrap-${{ matrix.arch }}.zip .
          cd ..
          rm -rf temp_bootstrap termux-x11.deb

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-archives-${{ matrix.arch }}
          path: "*.zip"

  publish:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./

      - name: Create new tag
        id: get_tag
        run: |
          new_tag="bootstrap-$(date "+%Y.%m.%d")-x11"
          echo "tag_name=$new_tag" >> $GITHUB_OUTPUT

      - name: Publish bootstrap zips to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.get_tag.outputs.tag_name }} --title "Custom X11 Bootstrap Archives" || true
          for file in *.zip; do
            gh release upload ${{ steps.get_tag.outputs.tag_name }} "$file" --clobber
          done
